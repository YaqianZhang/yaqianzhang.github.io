---
layout: default
---
<article class="post">
  <p class="back"><a href="{{ '/projects/' | relative_url }}">← All projects</a></p>
  {% if page.label %}<span class="label">{{ page.label }}</span>{% endif %}
  <h1>{{ page.title }}</h1>
  <p class="meta">{{ page.date | date: "%B %Y" }}</p>
  {{ content }}
</article>
